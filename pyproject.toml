[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shexec"
dynamic = ["version"]
description = "Run a shell-type command over every file of an input tree: a ChRIS DS plugin on pfdo_run"
readme = "README.rst"
license = { text = "MIT" }
authors = [{ email = "dev@babyMRI.org" }]
# chris_plugin_info reads the legacy Author, Author-email and Home-page metadata
# fields, which the [project] table does not emit; setup.cfg supplies them, and the
# author name lives there alone so Author-email stays a bare address.
requires-python = ">=3.11"
dependencies = ["chris_plugin>=0.4.0", "pfdo>=6.2.0", "pfdo_run>=4.2.0", "hostlib>=1.2.0", "pflog>=2.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://github.com/FNNDSC/pl-shexec"

[project.scripts]
shexec = "shexec.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["shexec*"]

[tool.setuptools.dynamic]
version = { attr = "shexec.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
